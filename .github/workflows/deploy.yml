name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dayspan-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  # マニフェストに載っている値が、GitHub側から実際に届いているかを確かめる（#359）。
  # 無い値は空文字として渡り、deploy の update_env はそれをそのまま本番の .env へ書く。
  # 起動に要らない値では何も落ちないため、放っておくと「機能は入っているのに使えない」
  # 状態が誰にも気付かれずに残る（通知のVAPID鍵がそうなっていた）。
  #
  # デプロイは止めない。VAPID鍵のように、無くても他の機能は動く値が含まれるため
  # （docs/notifications.md）。気付ける場所を作るのが目的で、Signalyへも1通出す。
  #
  # env にはマニフェストの repo 項目をすべて並べる。並べ忘れた項目はスクリプトが
  # undeclared として報告する。
  secrets-check:
    runs-on: ubuntu-latest

    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      DB_NAME: ${{ secrets.DB_NAME }}
      GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: マニフェストのrepo項目が届いているか確かめる
        id: check
        run: bash .github/scripts/check-repo-secrets.sh

      - name: Signaly に通知
        # 届いていない値があるときだけ出す。通知そのものの失敗でrunを落とさない。
        if: steps.check.outputs.missing != '' || steps.check.outputs.undeclared != ''
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: dayspan
          NOTIFY_KIND: シークレット確認
          NOTIFY_STATUS: failure
        run: bash .github/scripts/signaly-notify.sh

  build:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      DB_NAME: ${{ secrets.DB_NAME }}
      GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create archive
        run: |
          tar -czf deploy.tar.gz \
            package.json \
            pnpm-lock.yaml \
            public \
            .next \
            prisma \
            deploy \
            next.config.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      DB_NAME: ${{ secrets.DB_NAME }}
      GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
        env:
          HOST: ${{ env.HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}

      # **VPSのgate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275）へ渡す**（#1257）。
      # 鍵はこのアプリ専用で、VPSのauthorized_keysのcommand=がgateのアプリ名（dayspan。置き場の
      # /home/github-user/apps/dayspan とpm2のプロセス名に一致する）を固定する。任意のシェルコマンドは
      # 実行できず、upload・env・deployの3語だけが通る。旧配布物の削除（next.config.tsを含む）・展開・
      # .env更新・pnpm install・prisma migrate deploy（MIGRATE_DATABASE_URLは.envへ書かずここだけで使う）・
      # pm2の再起動・稼働版の照合はgate側が行う。
      - name: Upload archive
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" upload < deploy.tar.gz
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}

      - name: Send environment variables
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}
          # 稼働中の版の確認に使う（guchi-apps/issue-deck#4712）。gateが.envのAPP_COMMIT_SHAと
          # 稼働中の/api/app-versionのshaを照合する（guchi-apps/vps#298）。コミットのSHAは公開情報
          APP_COMMIT_SHA: ${{ github.sha }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ env.TOKEN_ENCRYPTION_KEY }}
          GOOGLE_CALENDAR_CLIENT_ID: ${{ env.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ env.GOOGLE_CALENDAR_CLIENT_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          OPS_API_TOKEN: ${{ env.OPS_API_TOKEN }}
          TYPESAFE_API_KEY: ${{ env.TYPESAFE_API_KEY }}
          SHARED_TOKEN_API_SECRET: ${{ env.SHARED_TOKEN_API_SECRET }}
          ISSUE_DECK_URL: ${{ env.ISSUE_DECK_URL }}
          VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ env.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ env.VAPID_SUBJECT }}
          APNS_KEY_ID: ${{ env.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ env.APNS_TEAM_ID }}
          APNS_PRIVATE_KEY: ${{ env.APNS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # gateは標準入力を1行1変数（KEY=VALUE）で受けるため、改行を含む値は送れない。
          # APNsの認証キーはPEM（複数行）のまま1Passwordにあるので、base64の1行へ直して送る
          # （src/lib/apns/config.ts の normalizeApnsPrivateKey() はbase64も受ける）。
          case "$APNS_PRIVATE_KEY" in
            *BEGIN*|*$'\n'*) APNS_PRIVATE_KEY="$(printf '%s' "$APNS_PRIVATE_KEY" | base64 -w0)" ;;
          esac
          for name in DATABASE_URL MIGRATE_DATABASE_URL DB_USER DB_PASSWORD DB_HOST DB_PORT DB_NAME \
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY TOKEN_ENCRYPTION_KEY \
            GOOGLE_CALENDAR_CLIENT_ID GOOGLE_CALENDAR_CLIENT_SECRET CLAUDE_CODE_OAUTH_TOKEN OPS_API_TOKEN \
            TYPESAFE_API_KEY SHARED_TOKEN_API_SECRET ISSUE_DECK_URL VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY \
            VAPID_SUBJECT APNS_KEY_ID APNS_TEAM_ID APNS_PRIVATE_KEY; do
            case "${!name}" in
              *$'\n'*) echo "::error::${name} が改行を含むためgateへ送れません"; exit 1 ;;
            esac
          done
          # 待受ポートはシークレットではなく設定値として平文で持つ
          # （guchi-apps/docs の standards/ports.md「ポート番号は 1Password で管理しない」。#267）。
          {
            printf '%s\n' "NODE_ENV=production" "PORT=3113"
            printf '%s\n' "APP_COMMIT_SHA=${APP_COMMIT_SHA}"
            printf '%s\n' "DATABASE_URL=${DATABASE_URL}"
            printf '%s\n' "MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL}"
            printf '%s\n' "DB_USER=${DB_USER}"
            printf '%s\n' "DB_PASSWORD=${DB_PASSWORD}"
            printf '%s\n' "DB_HOST=${DB_HOST}"
            printf '%s\n' "DB_PORT=${DB_PORT}"
            printf '%s\n' "DB_NAME=${DB_NAME}"
            printf '%s\n' "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            printf '%s\n' "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            printf '%s\n' "TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}"
            printf '%s\n' "GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID}"
            printf '%s\n' "GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET}"
            printf '%s\n' "CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}"
            # ops-dashboardがAIの使用量（GET /api/internal/ai-usage）を読むときのBearer認証（#680）
            printf '%s\n' "OPS_API_TOKEN=${OPS_API_TOKEN}"
            # 買い物のカテゴリの自動判定（TypeSafeのJev・#725）。未設定なら判定だけが使えない
            printf '%s\n' "TYPESAFE_API_KEY=${TYPESAFE_API_KEY}"
            # 共有トークンAPI（issue-deck）。未設定だと各トークンが環境変数へ落ちる（issue #860）
            printf '%s\n' "SHARED_TOKEN_API_SECRET=${SHARED_TOKEN_API_SECRET}"
            printf '%s\n' "ISSUE_DECK_URL=${ISSUE_DECK_URL}"
            printf '%s\n' "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}"
            printf '%s\n' "VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}"
            printf '%s\n' "VAPID_SUBJECT=${VAPID_SUBJECT}"
            printf '%s\n' "APNS_KEY_ID=${APNS_KEY_ID}"
            printf '%s\n' "APNS_TEAM_ID=${APNS_TEAM_ID}"
            printf '%s\n' "APNS_PRIVATE_KEY=${APNS_PRIVATE_KEY}"
          } | ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" env

      - name: Deploy and restart
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" deploy
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    if: always()

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: dayspan
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: dayspan
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
